name: AWS DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: ousl-student-api
  IMAGE_NAME: ousl-student-api
  SONAR_ORGANIZATION: YOUR_SONAR_ORG        # <-- your SonarCloud organization key

jobs:
  build-and-secure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ousl-project     # Routes all run steps into your subfolder

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                    # SonarCloud needs full history

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 1. Build & unit test, then 2. SAST. The job fails if the Quality Gate fails.
      - name: SonarCloud SAST Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify sonar:sonar
          -Dsonar.projectKey=ousl-student-service
          -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true

      # 3. Container packaging, tagged with the Git commit SHA
      - name: Build Container Image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # 4. Vulnerability scan. exit-code '1' breaks the build on CRITICAL findings.
      - name: Aqua Security Trivy Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      # 5. Authenticate to AWS and push the validated image to ECR
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and Push Image to ECR
        run: |
          IMAGE_URI=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} $IMAGE_URI
          docker push $IMAGE_URI
